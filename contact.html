<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Dress Point</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/shop.css"><link rel="stylesheet" href="css/cart.css">
</head><body data-page="contact"><div id="site-header"></div>
<div class="container section">
  <div class="section-header"><span class="section-subtitle">We Are Here For You</span><h1 class="section-title">Get in Touch with Dress Point</h1></div>
  <div id="contactMsg"></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:40px;margin-bottom:50px;">
    <div style="background:var(--bg-white);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:32px;">
      <h2 style="font-size:1.4rem;margin-bottom:20px;">Store Information</h2>
      <p style="margin-bottom:14px;"><b>&#128205; Location:</b><br>No. 128, Galle Road, Bambalapitiya, Colombo 03</p>
      <p style="margin-bottom:14px;"><b>&#128222; Phone:</b><br>+94 11 234 5678<br>+94 77 123 4567</p>
      <p style="margin-bottom:14px;"><b>&#9993; Email:</b><br>info@dresspoint.lk</p>
      <p><b>&#128340; Hours:</b><br>Mon – Sat: 9:00 AM – 8:30 PM</p></div>
    <div style="background:var(--bg-white);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:32px;">
      <h2 style="font-size:1.4rem;margin-bottom:20px;">Send Us a Message</h2>
      <form id="contactForm">
        <div class="form-group" style="margin-bottom:14px;"><label class="form-label" for="c_name">Full Name *</label><input type="text" id="c_name" class="form-control" required></div>
        <div class="form-group" style="margin-bottom:14px;"><label class="form-label" for="c_email">Email *</label><input type="email" id="c_email" class="form-control" required></div>
        <div class="form-group" style="margin-bottom:14px;"><label class="form-label" for="c_msg">Message *</label><textarea id="c_msg" class="form-control" rows="5" required></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">&#128233; Send Inquiry</button>
      </form></div>
  </div>
</div>
<div id="site-footer"></div><script src="js/data.js"></script><script src="js/app.js"></script></body></html>
